{% extends "base.html" %}

{% block title %}Añadir Punto de Recogida | Tractor Amarillo{% endblock %}

{% block content %}
<div class="container my-5">
    <h2 class="text-success mb-4 fw-bold">Añadir Punto de Recogida</h2>
    
    <div class="card shadow-sm rounded-3 p-4 bg-light">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                    <label for="{{ form.direccion.id_for_label }}" class="form-label text-navbar">Dirección</label>
                    {{ form.direccion }}
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="{{ form.ciudad.id_for_label }}" class="form-label text-navbar">Ciudad</label>
                        {{ form.ciudad }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="{{ form.pais.id_for_label }}" class="form-label text-navbar">Pais</label>
                        {{ form.pais }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="{{ form.codigoPostal.id_for_label }}" class="form-label text-navbar">Código Postal</label>
                        {{ form.codigoPostal }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="{{ form.horario.id_for_label }}" class="form-label text-navbar">Horario</label>
                        {{ form.horario }}
                    </div>
                </div>

            <button type="submit" class="btn btn-success w-100">Guardar Punto</button>
        </form>
    </div>
</div>
{% endblock %}
